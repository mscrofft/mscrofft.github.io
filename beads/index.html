<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title data-i18n="appTitle">BEAD PATTERN GENERATOR</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#f7b955" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Beads" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />
<link rel="icon" type="image/png" href="./icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
</head>
<body>
<header class="topbar">
  <button id="btn-toggle-tools" class="drawer-toggle" aria-label="Tools">☰</button>
  <div class="brand">BEAD PATTERN GENERATOR</div>
  <button id="btn-toggle-palette" class="drawer-toggle" aria-label="Palette">🎨</button>
  <div class="topbar-actions">
    <label data-i18n="stitch">Ponto:</label>
    <select id="stitch-select">
      <option value="peyote-even" data-i18n="peyoteEven">Peyote Par</option>
      <option value="peyote-odd" data-i18n="peyoteOdd">Peyote Ímpar</option>
      <option value="brick" data-i18n="brick">Tijolo</option>
      <option value="herringbone" data-i18n="herringbone">Espinha de Peixe</option>
      <option value="square" data-i18n="square">Quadrado</option>
      <option value="embroidery" data-i18n="embroidery">Costura (Embroidery)</option>
      <option value="contour" data-i18n="contour">Contorno</option>
    </select>
    <button id="btn-new" data-i18n="new">Novo</button>
    <button id="btn-undo" title="Ctrl+Z">↶</button>
    <button id="btn-redo" title="Ctrl+Y">↷</button>
    <button id="btn-import-img" data-i18n="importImg">Importar Imagem</button>
    <button id="btn-save-json" data-i18n="save">Salvar</button>
    <button id="btn-load-json" data-i18n="open">Abrir</button>
    <button id="btn-export-png" data-i18n="exportPng">PNG</button>
    <button id="btn-export-pdf" data-i18n="exportPdf">PDF A4</button>
    <button id="btn-cloud-save" data-i18n="saveCloud" style="display:none">☁ Salvar</button>
    <button id="btn-cloud-list" data-i18n="myPatterns" style="display:none">Meus padrões</button>
    <button id="btn-cloud-login" data-i18n="login">Login</button>
    <span id="cloud-user" style="display:none; font-size:12px; opacity:0.8"></span>
    <button id="btn-cloud-logout" data-i18n="logout" style="display:none">Sair</button>
    <select id="lang-select" title="Language">
      <option value="pt">PT</option>
      <option value="en">EN</option>
    </select>
  </div>
</header>

<main class="workspace">
  <aside class="tools-panel">
    <h3 data-i18n="tools">Ferramentas</h3>
    <button class="tool" data-tool="brush" data-i18n="brush">Pincel</button>
    <button class="tool" data-tool="bucket" data-i18n="bucket">Balde</button>
    <button class="tool" data-tool="eraser" data-i18n="eraser">Borracha</button>
    <button class="tool" data-tool="picker" data-i18n="picker">Conta-gotas</button>
    <button class="tool" data-tool="line" data-i18n="line">Linha</button>
    <button class="tool" data-tool="rect" data-i18n="rect">Retângulo</button>
    <button class="tool" data-tool="select-rect" data-i18n="selectRect">Seleção □</button>
    <button class="tool" data-tool="select-lasso" data-i18n="selectLasso">Laço</button>
    <div class="clipboard-ops">
      <button id="btn-flip-h" title="↔ Espelhar H">↔</button>
      <button id="btn-flip-v" title="↕ Espelhar V">↕</button>
      <button id="btn-rotate" title="↻ Girar 90°">↻</button>
    </div>
    <hr/>
    <label data-i18n="brushSize">Tamanho do pincel</label>
    <input type="range" id="brush-size" min="1" max="9" step="2" value="1" />
    <div class="brush-shape-row">
      <button class="brush-shape-btn active" data-shape="square" title="Quadrado">□</button>
      <button class="brush-shape-btn" data-shape="circle" title="Círculo">○</button>
    </div>
    <hr/>
    <label data-i18n="zoom">Zoom</label>
    <input type="range" id="zoom" min="6" max="40" value="18" />
    <label><input type="checkbox" id="show-numbers" /> <span data-i18n="showNumbers">Mostrar números</span></label>
    <hr/>
    <button id="btn-clear" data-i18n="clear">Limpar</button>
    <hr/>
    <label data-i18n="presetLabel">Preset</label>
    <select id="preset-select">
      <option value="" data-i18n="presetNone">— escolher —</option>
      <option value="randomUniform" data-i18n="presetRandomUniform">Aleatório uniforme</option>
      <option value="randomWeighted" data-i18n="presetRandomWeighted">Aleatório ponderado</option>
      <option value="stripesH" data-i18n="presetStripesH">Listras horizontais</option>
      <option value="stripesV" data-i18n="presetStripesV">Listras verticais</option>
      <option value="diagonalSlash" data-i18n="presetDiagSlash">Diagonais /</option>
      <option value="diagonalBackslash" data-i18n="presetDiagBack">Diagonais \</option>
      <option value="checker" data-i18n="presetChecker">Xadrez</option>
      <option value="diamond" data-i18n="presetDiamond">Losango</option>
      <option value="diamondsTiled" data-i18n="presetDiamondsTiled">Losangos (harlequim)</option>
      <option value="squaresTiled" data-i18n="presetSquaresTiled">Quadrados tiled</option>
      <option value="waves" data-i18n="presetWaves">Ondas</option>
      <option value="gradientH" data-i18n="presetGradientH">Gradiente horizontal</option>
      <option value="gradientV" data-i18n="presetGradientV">Gradiente vertical</option>
    </select>
    <div id="preset-params"></div>
    <button id="btn-preset-apply" data-i18n="apply">Aplicar</button>
  </aside>

  <section class="canvas-area">
    <canvas id="grid-canvas"></canvas>
  </section>

  <aside class="palette-panel">
    <h3 data-i18n="palette">Paleta</h3>
    <select id="palette-select">
      <option value="custom" data-i18n="custom">Personalizada</option>
      <option value="miyuki" data-i18n="miyuki">Miyuki Delica</option>
      <option value="toho" data-i18n="toho">Toho Round</option>
    </select>
    <div id="palette-list" class="palette-list"></div>
    <button id="btn-palette-delete" class="palette-delete-btn" data-i18n="deleteColors">Deletar cores</button>
    <hr/>
    <h4 data-i18n="usedColors">Cores usadas</h4>
    <div id="used-colors"></div>
    <div class="palette-ops">
      <button id="btn-prune-unused" data-i18n="pruneUnused">Limpar não usadas</button>
      <button id="btn-reduce-colors" data-i18n="reduceColors">Reduzir cores...</button>
    </div>
    <div class="custom-color-row">
      <input type="color" id="custom-color" value="#cc3366" />
      <button id="btn-add-custom" data-i18n="addColor">+ cor</button>
    </div>
  </aside>
</main>

<div id="drawer-backdrop" class="drawer-backdrop hidden"></div>

<!-- Modal: Novo padrão -->
<div class="modal hidden" id="modal-new">
  <div class="modal-content">
    <h3 data-i18n="newPattern">Novo padrão</h3>
    <label data-i18n="stitch">Ponto:</label>
    <select id="new-stitch">
      <option value="peyote-even">Peyote Par</option>
      <option value="peyote-odd">Peyote Ímpar</option>
      <option value="brick">Brick</option>
      <option value="herringbone">Herringbone</option>
      <option value="square">Square</option>
      <option value="embroidery">Embroidery</option>
      <option value="contour">Contour</option>
    </select>
    <label data-i18n="width">Largura (miçangas):</label>
    <input type="number" id="new-width" value="30" min="2" max="300" />
    <label data-i18n="height">Altura (linhas):</label>
    <input type="number" id="new-height" value="40" min="2" max="300" />
    <div class="modal-actions">
      <button id="btn-new-cancel" data-i18n="cancel">Cancelar</button>
      <button id="btn-new-create" data-i18n="create">Criar</button>
    </div>
  </div>
</div>

<!-- Modal: Importar imagem -->
<div class="modal hidden" id="modal-import">
  <div class="modal-content">
    <h3 data-i18n="importImg">Importar imagem</h3>
    <input type="file" id="img-file" accept="image/*" />
    <label data-i18n="width">Largura (miçangas):</label>
    <input type="number" id="img-width" value="40" min="4" max="200" />
    <label data-i18n="height">Altura (linhas):</label>
    <input type="number" id="img-height" value="50" min="4" max="200" />
    <label data-i18n="numColors">Nº de cores:</label>
    <input type="number" id="img-colors" value="10" min="2" max="32" />
    <label><input type="checkbox" id="img-lock-ratio" checked /> <span data-i18n="lockRatio">Manter proporção da imagem</span></label>
    <canvas id="img-preview" width="200" height="200"></canvas>
    <div class="modal-actions">
      <button id="btn-import-cancel" data-i18n="cancel">Cancelar</button>
      <button id="btn-import-apply" data-i18n="apply">Aplicar</button>
    </div>
  </div>
</div>

<!-- Modal: Export PDF -->
<div class="modal hidden" id="modal-pdf">
  <div class="modal-content">
    <h3 data-i18n="exportPdf">Exportar PDF A4</h3>
    <label data-i18n="title">Título:</label>
    <input type="text" id="pdf-title" placeholder="Minha receita" />
    <label data-i18n="author">Autora:</label>
    <input type="text" id="pdf-author" placeholder="" />
    <label><input type="checkbox" id="pdf-legend" checked /> <span data-i18n="includeLegend">Incluir legenda de cores</span></label>
    <label><input type="checkbox" id="pdf-wordchart" checked /> <span data-i18n="includeWordchart">Incluir word chart</span></label>
    <label data-i18n="labelMode">Identificação das cores:</label>
    <select id="pdf-label-mode">
      <option value="both" data-i18n="labelBoth">Nome + código</option>
      <option value="name" data-i18n="labelName">Só nome</option>
      <option value="code" data-i18n="labelCode">Só código</option>
    </select>
    <div class="modal-actions">
      <button id="btn-pdf-cancel" data-i18n="cancel">Cancelar</button>
      <button id="btn-pdf-generate" data-i18n="generate">Gerar PDF</button>
    </div>
  </div>
</div>

<!-- Modal: Login (magic link) -->
<div class="modal hidden" id="modal-login">
  <div class="modal-content">
    <h3 data-i18n="login">Login</h3>
    <p style="font-size:12px;opacity:0.8" data-i18n="loginHint">Digite seu e-mail e enviaremos um link mágico para entrar.</p>
    <label data-i18n="enterEmail">E-mail:</label>
    <input type="email" id="login-email" placeholder="voce@exemplo.com" />
    <div id="login-status" style="font-size:12px;color:#f7b955;min-height:14px"></div>
    <div class="modal-actions">
      <button id="btn-login-cancel" data-i18n="cancel">Cancelar</button>
      <button id="btn-login-send" data-i18n="sendLink">Enviar link</button>
    </div>
  </div>
</div>

<!-- Modal: Salvar na nuvem -->
<div class="modal hidden" id="modal-save-cloud">
  <div class="modal-content">
    <h3 data-i18n="saveCloud">Salvar na nuvem</h3>
    <label data-i18n="title">Título:</label>
    <input type="text" id="cloud-title" placeholder="Meu padrão" />
    <div class="modal-actions">
      <button id="btn-save-cloud-cancel" data-i18n="cancel">Cancelar</button>
      <button id="btn-save-cloud-update" data-i18n="updateExisting" style="display:none">Atualizar</button>
      <button id="btn-save-cloud-new" data-i18n="saveAsNew">Salvar como novo</button>
    </div>
  </div>
</div>

<!-- Modal: Meus padrões -->
<div class="modal hidden" id="modal-patterns">
  <div class="modal-content modal-wide">
    <h3 data-i18n="myPatterns">Meus padrões</h3>
    <div id="patterns-grid" class="patterns-grid"></div>
    <div class="modal-actions">
      <button id="btn-patterns-close" data-i18n="cancel">Fechar</button>
    </div>
  </div>
</div>

<input type="file" id="json-file-input" accept="application/json" style="display:none" />

<script src="js/i18n.js" defer></script>
<script src="data/palettes.js" defer></script>
<script src="js/palette.js" defer></script>
<script src="js/history.js" defer></script>
<script src="js/stitches.js" defer></script>
<script src="js/grid.js" defer></script>
<script src="js/selection.js" defer></script>
<script src="js/tools.js" defer></script>
<script src="js/image-import.js" defer></script>
<script src="js/sequencer.js" defer></script>
<script src="js/presets.js" defer></script>
<script src="js/config.js" defer></script>
<script src="js/cloud.js" defer></script>
<script src="js/export.js" defer></script>
<script src="js/app.js" defer></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  }
</script>
</body>
</html>
