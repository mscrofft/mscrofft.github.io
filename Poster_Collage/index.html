<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <title>Poster Collage</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"/>
  <link rel="stylesheet" href="../shared/ui-theme.css"/>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0d; }
    #ui-panel { top: var(--bar-h) !important; height: calc(100vh - var(--bar-h)) !important; }
    #ui-theme-toggle { display: none !important; }
    #stage {
      position: fixed; top: 0; left: 0; bottom: 0; right: 230px;
      display: flex; align-items: center; justify-content: center;
      padding: calc(var(--bar-h) + 16px) 24px 24px; box-sizing: border-box;
    }
    canvas { display: block; box-shadow: 0 0 0 1px var(--ui-border); }
    #hint {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      padding: 8px 12px; border-radius: 2px; backdrop-filter: blur(6px);
      max-width: 320px; pointer-events: none;
    }
    .swatches { display: flex; gap: 3px; padding: 3px 14px 6px; }
    .swatches i { flex: 1; height: 10px; border: 1px solid var(--ui-border); }
    @media (max-width: 700px) {
      #stage { right: 0; bottom: 45vh; }
      #ui-panel { top: auto !important; bottom: 0; left: 0; width: 100% !important; height: 45vh !important; border-left: 0 !important; border-top: 1px solid var(--ui-border); }
    }
  </style>
</head>
<body class="ui-std">
  <header class="site-header site-header--bar">
    <a class="site-logo" href="../index.html">MS<span>.</span></a>
    <span class="site-title">Poster Collage</span>
    <a class="site-back" href="../index.html">← back</a>
    <span class="site-spacer"></span>
    <button class="ui-invert-btn" type="button" data-ui-invert title="Inverter cores">Inverter</button>
  </header>

  <div id="stage"><canvas id="cv"></canvas></div>
  <input id="files" type="file" multiple accept="image/png,image/jpeg,image/gif,image/svg+xml" style="display:none"/>
  <div id="hint" hidden></div>

  <script src="../shared/site-header.js"></script>
  <script src="./ui-theme.js"></script>
  <script src="./sketch.js"></script>
</body>
</html>
