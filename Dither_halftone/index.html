<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <title>Bitmap/Dithering — Imagem & Vídeo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>
  <link rel="stylesheet" href="../shared/ui-theme.css"/>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #0b0b0d;
    }
    #ui-panel { top: var(--bar-h) !important; height: calc(100vh - var(--bar-h)) !important; }
    #ui-theme-toggle { display: none !important; }
    @media (max-width: 700px) {
      #ui-panel { top: auto !important; bottom: 0; left: 0; width: 100% !important; height: 45vh !important; border-left: 0 !important; border-top: 1px solid var(--ui-border); }
    }
    canvas {
      display: block;
      background: #0b0b0d;
    }
    /* hint — estilo vem do ui-theme.js, aqui apenas posicionamento */
    #hint {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 10;
      padding: 8px 12px;
      border-radius: 2px;
      backdrop-filter: blur(6px);
      max-width: 320px;
      pointer-events: none;
    }
  </style>
</head>
<body class="ui-std">
  <header class="site-header site-header--bar">
    <a class="site-logo" href="../index.html">MS<span>.</span></a>
    <span class="site-title">Dither Halftone</span>
    <a class="site-back" href="../index.html">← back</a>
    <span class="site-spacer"></span>
    <button class="ui-invert-btn" type="button" data-ui-invert title="Inverter cores">Inverter</button>
  </header>
  <input accept="image/*,video/mp4,video/webm" id="file" type="file" style="display:none"/>
  <div id="hint">Use o painel → <b>Upload image / video…</b></div>

  <!-- sistema de tema (deve vir antes do sketch) -->
  <script src="../shared/site-header.js"></script>
  <script src="./ui-theme.js"></script>
  <!-- sketch principal -->
  <script src="./sketch.js"></script>
</body>
</html>
