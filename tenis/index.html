<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Tênis — Celular como Raquete</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.3/lib/p5.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>

  <link rel="stylesheet" href="../shared/ui-theme.css" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1622; }
    canvas { display: block; }

    /* ── Painel de conexão (QR + código) ─────────────────────── */
    #conn {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 50;
      background: rgba(8, 16, 26, 0.92);
      border: 1px solid var(--ui-accent, #d4b87a);
      border-radius: 14px;
      padding: 28px 30px 26px;
      width: min(86vw, 360px);
      text-align: center;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      color: var(--ui-fg, #f0ece3);
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    }
    #conn h2 {
      margin: 0 0 4px;
      font-size: 15px;
      letter-spacing: 0.06em;
      font-weight: 600;
    }
    #conn p { margin: 0 0 16px; font-size: 11px; opacity: 0.6; line-height: 1.5; }
    #qr {
      width: 188px; height: 188px;
      margin: 0 auto 16px;
      background: #fff;
      border-radius: 8px;
      padding: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    #qr canvas, #qr img { width: 100% !important; height: 100% !important; }
    .code-label { font-size: 9px; letter-spacing: 0.25em; opacity: 0.45; text-transform: uppercase; }
    #code {
      font-size: 26px; letter-spacing: 0.32em;
      font-weight: 700; margin: 4px 0 14px;
      color: var(--ui-accent, #d4b87a);
    }
    #status { font-size: 11px; opacity: 0.7; min-height: 16px; }
    #status.err { color: #e8806b; opacity: 1; }
    #hint {
      margin-top: 14px; font-size: 10px; opacity: 0.45; line-height: 1.6;
      border-top: 1px solid rgba(240,236,227,0.12); padding-top: 12px;
    }
    #conn.hidden { display: none; }

    /* Aviso "conectado" rápido */
    #flash {
      position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
      z-index: 40; font-family: 'IBM Plex Mono', monospace; font-size: 12px;
      letter-spacing: 0.08em; color: #7fe0a0; background: rgba(8,16,26,0.85);
      border: 1px solid #7fe0a0; border-radius: 20px; padding: 8px 18px;
      opacity: 0; transition: opacity 0.4s ease; pointer-events: none;
    }
    #flash.show { opacity: 1; }
  </style>
</head>
<body>

  <div id="conn">
    <h2>Conecte seu celular 🎾</h2>
    <p>Aponte a câmera do celular para o QR code. O telefone vira sua raquete.</p>
    <div id="qr"></div>
    <div class="code-label">ou abra <b>.../tenis/control.html</b> e digite</div>
    <div id="code">······</div>
    <div id="status">iniciando…</div>
    <div id="hint">Sem celular? Jogue com o <b>mouse</b> (move) + <b>ESPAÇO</b> (raquetada).<br/>Pressione <b>ENTER</b> para fechar este painel.</div>
  </div>

  <div id="flash">📱 celular conectado</div>

  <script src="../shared/ui-theme-lite.js"></script>
  <script>UITheme.mountHeader({ title: 'Tênis · Raquete no Celular' });</script>
  <script src="net.js"></script>
  <script src="game.js"></script>
</body>
</html>
